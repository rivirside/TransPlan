<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transplant.today - Transplant Checklist</title>
    <link rel="stylesheet" href="styles.css">
    <script src="dark-mode.js"></script>
    <style>
        .checklist-header { text-align: center; padding: 2.5rem 1rem 0.5rem; }
        .checklist-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .checklist-header p { color: var(--text-muted, #6b7280); margin-bottom: 1rem; }

        .checklist-toolbar {
            max-width: 800px; margin: 0 auto 1.5rem; padding: 0 1rem;
            display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .progress-wrap { flex: 1; min-width: 200px; }
        .progress-bar {
            height: 8px; background: var(--border, #e5e7eb); border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--accent, #6366f1); border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-label { font-size: 0.8rem; color: var(--text-muted, #6b7280); margin-top: 0.25rem; }
        .toolbar-buttons { display: flex; gap: 0.5rem; }
        .toolbar-buttons button {
            padding: 0.45rem 0.85rem; border: 1px solid var(--border, #d1d5db); border-radius: 6px;
            background: var(--surface, #fff); color: var(--text-1, #111); cursor: pointer; font-size: 0.82rem;
        }
        .toolbar-buttons button:hover { border-color: var(--accent, #6366f1); color: var(--accent, #6366f1); }

        .checklist-content { max-width: 800px; margin: 0 auto 3rem; padding: 0 1rem; }

        .phase {
            background: var(--surface, #fff); border: 1px solid var(--border, #e5e7eb);
            border-radius: 6px; margin-bottom: 1rem; overflow: hidden;
        }
        .phase-header {
            padding: 0.85rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
            border-bottom: 1px solid var(--border-light, #f3f4f6);
        }
        .phase-number {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: #fff; background: var(--accent, #6366f1); flex-shrink: 0;
        }
        .phase-title { font-weight: 600; font-size: 1rem; color: var(--text-1, #111); }
        .phase-desc { font-size: 0.82rem; color: var(--text-muted, #6b7280); margin-left: auto; }

        .checklist-items { padding: 0.5rem 0; }
        .checklist-item {
            display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 1.25rem; cursor: pointer;
        }
        .checklist-item:hover { background: var(--surface-raised, #f9fafb); }
        .checklist-item input[type="checkbox"] {
            margin-top: 0.15rem; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent, #6366f1);
            cursor: pointer;
        }
        .checklist-item label { cursor: pointer; font-size: 0.9rem; color: var(--text-1, #111); line-height: 1.5; }
        .checklist-item.checked label { text-decoration: line-through; color: var(--text-muted, #9ca3af); }

        @media print {
            .site-nav, .toolbar-buttons, .site-footer { display: none; }
            .checklist-item input[type="checkbox"] { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <div class="checklist-header">
            <h1>Transplant Journey Checklist</h1>
            <p>Track your progress through the transplant process. Your progress is saved automatically in your browser.</p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">Resources: <a href="centers.html?mode=find" style="color: var(--accent);">Find Centers</a> | <a href="organ-guides.html" style="color: var(--accent);">Organ Guides</a> | <a href="education.html" style="color: var(--accent);">Education</a> | <a href="support.html" style="color: var(--accent);">Patient Support</a> | <a href="centers.html?mode=estimate" style="color: var(--accent);">Wait Estimator</a></p>
        </div>

        <div class="checklist-toolbar">
            <div class="progress-wrap">
                <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%;"></div></div>
                <div class="progress-label" id="progress-label">0 of 0 completed</div>
            </div>
            <div class="toolbar-buttons">
                <button type="button" id="print-btn">Print</button>
                <button type="button" id="reset-btn">Reset</button>
            </div>
        </div>

        <div class="checklist-content" id="checklist-content"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="components/site-chrome.js?v=8"></script>
    <script src="donation-banner.js"></script>
    <script src="session.js"></script>
    <script src="pages/checklist.page.js"></script>
    <!-- Vercel Analytics -->
    <script src="pages/vercel-analytics-stub.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
