<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transplant.today - Center Detail</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
    <script src="dark-mode.js"></script>
    <style>
        .center-detail {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }

        /* --- Loading & Error States --- */
        .loading-state, .error-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted, #6b7280);
        }
        .error-state h2 {
            font-size: 1.5rem;
            color: var(--text, #111827);
            margin-bottom: 0.5rem;
        }
        .error-state p {
            margin-bottom: 1.5rem;
        }
        .error-state a {
            color: var(--accent, #6366f1);
            text-decoration: none;
            font-weight: 500;
        }
        .error-state a:hover {
            text-decoration: underline;
        }

        /* --- Header Section --- */
        .center-header {
            margin-bottom: 1.5rem;
        }
        .center-header h1 {
            font-size: 1.75rem;
            color: var(--text, #111827);
            margin-bottom: 0.35rem;
            line-height: 1.25;
        }
        .center-location {
            font-size: 1rem;
            color: var(--text-muted, #6b7280);
            margin-bottom: 0.75rem;
        }
        .center-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .organ-badge {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .organ-badge--kidney    { background: #fde8e8; color: #991b1b; }
        .organ-badge--liver     { background: #f3e8ff; color: #6b21a8; }
        .organ-badge--heart     { background: #fce7f3; color: #9d174d; }
        .organ-badge--lung      { background: #dbeafe; color: #1e40af; }
        .organ-badge--pancreas  { background: #fff7ed; color: #9a3412; }
        .organ-badge--intestine { background: #dcfce7; color: #166534; }

        /* --- Quick Links (inline in header) --- */
        .center-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 1rem;
            margin-top: 0.75rem;
        }
        .quick-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-muted, #6b7280);
        }
        .quick-link:hover {
            color: var(--accent, #6366f1);
            text-decoration: underline;
        }
        .quick-link-icon {
            font-size: 0.85rem;
        }

        /* --- Section Card --- */
        .section-card {
            background: var(--surface, #fff);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 3px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .section-card h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            color: var(--text, #111827);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-light, #f3f4f6);
            cursor: pointer;
            user-select: none;
        }
        .section-card h2:hover { color: var(--accent, #6366f1); }
        .section-card h2:hover .section-toggle { border-color: var(--accent, #6366f1); color: var(--accent, #6366f1); }
        .section-toggle {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--text-muted, #6b7280);
            background: var(--surface-raised, #f9fafb);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 4px;
            padding: 0.1rem 0.45rem;
            flex-shrink: 0;
            transition: color 0.1s, border-color 0.1s;
        }
        .section-card.collapsed h2 { margin-bottom: 0; border-bottom-color: transparent; }
        .section-card.collapsed .section-body { display: none; }
        .section-card.collapsed .section-toggle { background: transparent; }
        .section-title-group { display: flex; align-items: baseline; gap: 0.6rem; min-width: 0; overflow: hidden; }
        .section-preview {
            font-size: 0.73rem;
            font-weight: 400;
            color: var(--text-muted, #9ca3af);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }
        .section-card.collapsed .section-preview { display: inline; }

        /* horizontal scroll wrapper for wide tables */
        .table-scroll { overflow-x: auto; }

        /* --- Map --- */
        .map-container {
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border, #e5e7eb);
        }

        /* --- Organ Programs Table --- */
        .programs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .programs-table th {
            text-align: left;
            padding: 0.6rem 0.75rem;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-muted, #6b7280);
            border-bottom: 2px solid var(--border, #e5e7eb);
        }
        .programs-table td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid var(--border-light, #f3f4f6);
            color: var(--text-2, #4a4f65);
        }
        .programs-table tr:last-child td {
            border-bottom: none;
        }
        .programs-table .organ-name {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
            text-transform: capitalize;
        }
        .organ-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .organ-dot--kidney,
        .organ-dot--liver,
        .organ-dot--heart,
        .organ-dot--lung,
        .organ-dot--pancreas,
        .organ-dot--intestine { background: var(--text-muted, #9ca3af); }

        .factor-good { color: #16a34a; }
        .factor-neutral { color: var(--text-2, #4a4f65); }
        .factor-caution { color: #d97706; }
        .factor-high { color: #dc2626; }

        .rating-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .rating-badge--better_than_expected { background: #d1fae5; color: #065f46; }
        .rating-badge--as_expected { background: #e0e7ff; color: #3730a3; }
        .rating-badge--worse_than_expected { background: #fee2e2; color: #991b1b; }
        .rating-badge--insufficient_data { background: #f3f4f6; color: #6b7280; }

        .no-data {
            color: var(--text-muted, #9ca3af);
            font-style: italic;
            font-size: 0.85rem;
        }

        /* --- Nearby Centers --- */
        .nearby-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nearby-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--border-light, #f3f4f6);
            gap: 0.75rem;
        }
        .nearby-item:last-child {
            border-bottom: none;
        }
        .nearby-info {
            flex: 1;
            min-width: 0;
        }
        .nearby-name {
            font-weight: 500;
            font-size: 0.88rem;
            color: var(--accent, #6366f1);
            text-decoration: none;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nearby-name:hover {
            text-decoration: underline;
        }
        .nearby-meta {
            font-size: 0.8rem;
            color: var(--text-muted, #6b7280);
            margin-top: 0.15rem;
        }
        .nearby-distance {
            font-size: 0.8rem;
            color: var(--text-muted, #6b7280);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .nearby-organ-count {
            font-size: 0.75rem;
            color: var(--text-3, #9ca3af);
        }

        /* --- Waitlist Stats --- */
        .waitlist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .waitlist-stat {
            background: var(--surface-raised, #f9fafb);
            border: 1px solid var(--border-light, #f3f4f6);
            border-radius: 2px;
            padding: 0.5rem 0.65rem;
        }
        .waitlist-stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text, #111827);
            line-height: 1.1;
        }
        .waitlist-stat-label {
            font-size: 0.73rem;
            color: var(--text-muted, #6b7280);
            margin-top: 0.15rem;
        }
        .waitlist-organ-select {
            font-size: 0.82rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 2px;
            background: var(--surface, #fff);
            color: var(--text-2, #374151);
            margin-bottom: 0.75rem;
            cursor: pointer;
        }

        /* --- Contact Card --- */
        .contact-card {
            background: var(--surface, #fff);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 3px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .contact-card h2 {
            font-size: 1.1rem;
            color: var(--text, #111827);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-light, #f3f4f6);
        }
        .contact-map-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
            align-items: stretch;
        }
        @media (max-width: 640px) {
            .contact-map-grid { grid-template-columns: 1fr; }
        }
        .contact-map-grid { min-height: 220px; }
        .contact-map-grid .map-container { height: 220px; }
        .contact-rows {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .contact-row {
            display: flex;
            gap: 0.45rem;
            align-items: flex-start;
            font-size: 0.88rem;
        }
        .contact-icon {
            flex-shrink: 0;
            width: 1.1rem;
            color: var(--text-muted, #6b7280);
            margin-top: 0.05rem;
        }
        .contact-value {
            color: var(--text-2, #374151);
            flex: 1;
            line-height: 1.4;
        }
        .contact-value a {
            color: var(--accent, #6366f1);
            text-decoration: none;
            word-break: break-all;
        }
        .contact-value a:hover {
            text-decoration: underline;
        }
        .contact-stale {
            margin-top: 0.75rem;
            padding: 0.4rem 0.6rem;
            background: var(--surface-raised, #fefce8);
            border: 1px solid #fde68a;
            border-radius: 2px;
            font-size: 0.78rem;
            color: #92400e;
        }

        /* --- Responsive --- */
        @media (max-width: 767px) {
            .center-header h1 {
                font-size: 1.35rem;
            }
            .quick-links {
                flex-direction: column;
            }
            .programs-table {
                font-size: 0.82rem;
            }
            .programs-table th, .programs-table td {
                padding: 0.5rem 0.4rem;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <div class="center-detail" id="center-detail">
            <div class="loading-state" id="loading-state">Loading center data...</div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="session.js"></script>
    <script src="components/site-chrome.js?v=8"></script>
    <script src="api-client.js"></script>
    <script src="shared/geo-utils.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="pages/center.page.js"></script>
    <!-- Vercel Analytics -->
    <script src="pages/vercel-analytics-stub.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
